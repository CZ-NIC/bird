## This is a configuration file for the stable-branch tool:
## https://github.com/marenamat/stable-branch.git

repo = "."
branches = [
  "master",
  "stable-v2.17",
  "stable-v2.18", 
  "stable-v2.19", 
  "thread-next",
  "stable-v3.1",
  "stable-v3.2", 
  "stable-v3.3",
]

hide_merges = true
issue_url = "https://gitlab.nic.cz/labs/bird/-/work_items/"

relevant_remotes = [ "embargo", "origin" ]

[match]
threshold = 0.80    # commit title similarity required to group commits (0–1)
by_author = true   # also require the same author

[beginnings]
"master"	= "1f5d2f4fd60e2f5ca1b2ba87852c56b5c0c78c93"
"stable-v2.17"	= "v2.17.7"
"stable-v2.18"	= "v2.18.4"
"stable-v2.19"	= "v2.19.3"
"thread-next"	= "5bed739703b640fc5e7a22b6c39bbe86ba98d3da"
"stable-v3.1"	= "v3.1.9"
"stable-v3.2"	= "v3.2.4"
"stable-v3.3"	= "v3.3.3"

[filter.hide_if]
Target = [ "minor" ]

[filter.highlight_if]
Target = [ "patch" ]
