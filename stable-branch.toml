## This is a configuration file for the stable-branch tool:
## https://github.com/marenamat/stable-branch.git

repo = "."
branches = [
  "master",
  "stable-v2.17",
  "stable-v2.18", 
  "stable-v2.19", 
  "thread-next",
  "stable-v3.1",
  "stable-v3.2", 
  "stable-v3.3",
]

hide_merges = true
issue_url = "https://gitlab.nic.cz/labs/bird/-/work_items/"

relevant_remotes = [ "embargo", "origin" ]

[match]
threshold = 0.80    # commit title similarity required to group commits (0–1)
by_author = true   # also require the same author

[beginnings]
"master"	= "64158b0150d7a8af50efe7495d0e82d235e5eb82"
"stable-v2.17"	= "v2.17.6"
"stable-v2.18"	= "v2.18.3"
"stable-v2.19"	= "v2.19.2"
"thread-next"	= "06ca9bf5c588df6c0587eb64bd375eb0ade526ab"
"stable-v3.1"	= "v3.1.8"
"stable-v3.2"	= "v3.2.3"
"stable-v3.3"	= "v3.3.2"

[filter.hide_if]
Target = [ "minor" ]

[filter.highlight_if]
Target = [ "patch" ]
